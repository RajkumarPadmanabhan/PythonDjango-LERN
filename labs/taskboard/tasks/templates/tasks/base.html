{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tasks{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tasks/site.css' %}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{% url 'task-list' %}">Task board</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out {{ user.get_username }}</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

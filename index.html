<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathline — Python and Django, from zero to production</title>
  <meta name="description" content="A complete Python and Django course: every keyword, the logic under the syntax, worked examples, exercises with solutions, and labs. Python 3.15 and Django 6.1.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141b22'/%3E%3Cpath d='M8 22 V10 h4.2 c3.2 0 5.1 1.6 5.1 4.1 0 2.6-1.9 4.2-5.1 4.2 H11 V22 H8zm3-6.2h1.1c1.5 0 2.3-.7 2.3-1.8S13.6 12.2 12.1 12.2H11v3.6zM19.2 22l2.7-12h3.1L22.2 22h-3zm6.2 0V10H28v12h-2.6z' fill='%23f3efe4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;650&family=Source+Serif+4:opsz,wght@8..60,460;8..60,620&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip" href="#stage">Skip to lesson</a>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <a href="#/home" class="brand-mark" data-nav="home">
          <span class="logo" aria-hidden="true">P</span>
          <span>
            <strong>Pathline</strong>
            <small>Python · Django</small>
          </span>
        </a>
        <button type="button" class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">×</button>
      </div>
      <label class="search">
        <span class="sr">Search lessons</span>
        <input id="search" type="search" placeholder="Search lessons, keywords, code" autocomplete="off">
      </label>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="progress-label">0 of 0 lessons</span>
          <button type="button" class="text-btn" id="reset-progress">Reset</button>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
      </div>
      <nav id="nav" aria-label="Course"></nav>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" id="menu-btn" aria-label="Open menu">☰</button>
        <p class="crumb" id="crumb">Pathline</p>
        <div class="top-actions">
          <button type="button" class="text-btn" id="theme-btn" aria-label="Toggle color theme">Theme</button>
          <a class="text-btn" href="labs/taskboard/README.md">Labs folder</a>
        </div>
      </header>
      <div class="stage-wrap" id="stage">
        <noscript><p class="callout watch">Pathline needs JavaScript to open lessons. Enable JavaScript, then reload.</p></noscript>
      </div>
    </div>
  </div>
  <script src="js/course-data.js?v=5"></script>
  <script src="js/engine.js?v=5"></script>
</body>
</html>
